# Server statis untuk SPA React. Container ini tidak punya `ports`;
# diakses lewat gateway nginx di repo backend.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Aset hasil build punya hash di nama file -> aman di-cache lama
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Fallback SPA: route React Router (mis. /login, /admin) dilayani index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
